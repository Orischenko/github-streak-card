name: Update streak card

on:
  schedule:
    # Hourly at an off-peak minute: GitHub often delays or drops runs at :00.
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check token
        env:
          GH_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Add a PROFILE_STATS_TOKEN secret first (see README)."
            exit 1
          fi
      - name: Build streak card and achievement progress
        run: |
          node scripts/streak.mjs
          node scripts/achievements.mjs
        env:
          # Personal token, so private contributions are counted too
          GH_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "chore: update streak card"
          git push
